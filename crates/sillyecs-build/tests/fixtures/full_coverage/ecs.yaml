# Fixture covers the items called out in issue #39:
#   - non-trivial command queue with a real `UserCommand` type (see user.rs)
#   - a phase with partial-hook state-use entries (`Render` phase below)
#   - at least one archetype with `allow_unsafe: false` (file-level default)
#   - promotions (Particle -> LivingParticle)
#   - frontload (generated unconditionally, exercised by archetype shape)
#   - system with `lookup`
#   - at least one fixed-step phase (`FixedUpdate`)
#   - parallel phases: `FixedUpdate` splits a `lookup` system and a writer into two
#     groups, `Update` schedules one group of two systems, one of them emitting commands
#   - user types outside the generated module: the generated code is included in a module that
#     imports nothing, and finds the user types through `paths` (issue #68). The test also runs
#     the fixture without the `paths` block, with the user types in scope by bare name.
#   - stateless systems (`Spin`, `Tint`) mixed with stateful ones; the user factory only covers
#     the stateful systems (issue #64)

allow_unsafe: false

states:
  - name: Input
  - name: Renderer

components:
  - name: Position
  - name: Velocity
  - name: Health
  - name: Sprite

archetypes:
  - name: Particle
    components: [Position, Velocity]
    promotions: [LivingParticle]
  - name: LivingParticle
    components: [Position, Velocity, Health]
  - name: Decoration
    components: [Position, Sprite]

views:
  - name: Movable
    description: A position plus velocity shared by Particle and LivingParticle.
    components: [Position, Velocity]

worlds:
  - name: Main
    archetypes: [Particle, LivingParticle, Decoration]

phases:
  - name: Boot
    manual: true
  - name: FixedUpdate
    fixed: 60Hz
  - name: Update
    on_request: true
  - name: Render
    manual: true
    states:
      # Partial-hook entry: no per-hook fields spelled out. Regression for issue #36.
      - use: Renderer
        default: write

systems:
  - name: Step
    phase: FixedUpdate
    context: true
    inputs: [Velocity]
    outputs: [Position]
    lookup: [Position]
    preflight: true
    postflight: true

  - name: Spin
    phase: FixedUpdate
    stateless: true
    outputs: [Sprite]

  - name: Heal
    phase: Update
    commands: true
    states:
      - use: Input
    outputs: [Health]

  - name: Draw
    phase: Render
    entities: true
    inputs: [Position, Sprite]
    states:
      - use: Renderer
        system: write

  - name: Tint
    phase: Update
    stateless: true
    outputs: [Sprite]

# --- paths (the compile test strips everything from this line on for the bare-name variant)
paths:
  components: crate::user
  states: crate::user
  systems: crate::user
  entity_location_map: crate::user::LocationMap
