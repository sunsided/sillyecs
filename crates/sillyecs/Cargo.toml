[package]
name = "sillyecs"
description = "A silly little compile-time generated archetype ECS in Rust"
keywords = ["ecs", "archetype", "game-development"]
categories = ["game-development", "game-engines"]
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
## Support `wasm32-unknown-unknown`: use `web-time` for frame timing (`std::time::Instant::now()`
## panics there) and enable Rayon's `web_spin_lock`, which avoids blocking the browser main thread
## when running multithreaded via `wasm-bindgen-rayon`.
wasm = ["dep:web-time", "rayon/web_spin_lock"]

[dependencies]
rayon = "1.12.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.3"

[[bench]]
name = "flatten_slices"
harness = false
