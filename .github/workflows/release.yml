name: Release

# Runs the full check suite on a version tag and, if it passes, creates the GitHub release.
# Deliberately uncached: a release build must not restore caches written by other refs.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - name: Check tag matches crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for manifest in crates/sillyecs/Cargo.toml crates/sillyecs-build/Cargo.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest")
            if [ "v${version}" != "${TAG}" ]; then
              echo "::error file=${manifest}::version ${version} does not match tag ${TAG}"
              exit 1
            fi
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  release:
    name: GitHub release
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release for the tag
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${TAG}"
